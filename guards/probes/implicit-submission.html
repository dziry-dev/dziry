<!doctype html>
<meta charset="utf-8">
<title>implicit-submission</title>
<style>
  body { font: 12px ui-monospace, monospace; padding: 16px }
  #out { white-space: pre; line-height: 1.5 }
  form { display: inline-flex; gap: 4px; margin: 0 8px 4px 0 }
  input, button, textarea { font: inherit }
  textarea { width: 90px; height: 20px }
</style>
<h3>when exactly does Enter in a field submit its form?</h3>
<div id="stage"></div>
<script type="module">
  import { log, report } from "./_harness.js";

  /**
   * Already measured (2026-08-05, `keyboard-activation.html`): Enter in a text field
   * inside a `<form>` clicks the form's submit button and then fires `submit`. That is
   * the *headline* and it is the easy half. The conditions are the half that decides how
   * much dziry has to build, and every one of them is a rule people state from memory:
   *
   * - **No submit button.** Does Enter submit anyway? If it does, `onSubmit` cannot be
   *   implemented as "click the default button" — there would be nothing to click.
   * - **More than one field.** HTML has a rule here that almost nobody can quote, and if
   *   it is real then dziry needs to count something at run time.
   * - **`<textarea>`.** Enter must insert a newline. If that is a property of the *tag*
   *   rather than of a submit rule, it is one exclusion; if it is a longer list of types,
   *   it is a table.
   * - **Which button**, when there are several, and whether `type="button"` and a
   *   disabled one are skipped. dziry's answer has to name a specific node.
   *
   * Every form here cancels its own `submit`, or the first success would navigate the
   * page away and every later row would measure a blank document.
   */

  const stage = document.getElementById("stage");
  const seen = [];

  // Each case is a form built from a fragment of markup, so that no case can inherit
  // another's structure — the same reason `mount()` exists in the harness.
  const CASES = [
    ["button + 1 field", `<input name=a><button type=submit>go</button>`],
    ["button + 2 fields", `<input name=a><input name=b><button type=submit>go</button>`],
    // The rule worth knowing. If "exactly one field" is real, these two disagree.
    ["no button, 1 field", `<input name=a>`],
    ["no button, 2 fields", `<input name=a><input name=b>`],
    // Is a bare <button> a submit button? Its default `type` is the question.
    ["bare <button>, 2 fields", `<input name=a><input name=b><button>go</button>`],
    // ...and is a non-submit one invisible to the rule, or merely not clicked?
    ["type=button only, 2 fields", `<input name=a><input name=b><button type=button>x</button>`],
    ["disabled submit, 2 fields", `<input name=a><input name=b><button type=submit disabled>go</button>`],
    // The pair above cannot distinguish "a disabled button is skipped, and then two
    // fields block" from "a disabled button blocks outright". With one field, the
    // skip-then-fall-through rule predicts a submit and the block rule predicts nothing.
    ["disabled submit, 1 field", `<input name=a><button type=submit disabled>go</button>`],
    // Does a checkbox count towards "exactly one field"? If it does not, the blocking set
    // is text-like types rather than form controls, and dziry needs to know which list.
    ["no button, 1 text + checkbox", `<input name=a><input type=checkbox name=c>`],
    ["no button, 1 text + select", `<input name=a><select name=s><option>x</option></select>`],
    // Does a <textarea> count towards "exactly one"? It is a text field by every intuition
    // and the spec's blocking list is written in terms of `input` *types*, which would
    // exclude it. The two readings disagree here and dziry has to pick one.
    ["no button, 1 text + textarea", `<input name=a><textarea></textarea>`],
    // Is `<input type=submit>` a default button? Only <button> was tested above, and dziry
    // would otherwise be implementing a rule from the spec rather than from a measurement.
    ["input[type=submit], 2 fields", `<input name=a><input name=b><input type=submit value=go>`],
    // Which one is "the" default: first in tree order, or something subtler.
    ["two submit buttons", `<input name=a><button type=submit id=first>1</button><button type=submit id=second>2</button>`],
    // Enter here must type a newline instead. Focus lands on the textarea, not the input.
    ["textarea + button", `<input name=a><textarea id=area></textarea><button type=submit>go</button>`],
    // A checkbox is not a text field; the earlier probe measured Enter doing nothing on
    // one *outside* a form, which cannot distinguish "Enter does nothing to a checkbox"
    // from "there was no form to submit".
    ["checkbox focused, has button", `<input type=checkbox id=box><button type=submit>go</button>`],
  ];

  const plan = [];
  CASES.forEach(([label, markup], i) => {
    const form = document.createElement("form");
    form.id = "f" + i;
    form.innerHTML = markup;
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      seen.push("submit");
    });
    // A click on the button is the mechanism the headline finding describes, so it is
    // recorded separately from the submit it causes — "submitted" and "clicked a button
    // that submitted" are different implementations and dziry has to pick one.
    for (const b of form.querySelectorAll("button, input[type=submit]")) {
      b.addEventListener("click", () => seen.push("click:" + (b.id || b.type)));
    }
    stage.appendChild(form);

    // Focus the field Enter is meant to be pressed in: the textarea for that case, the
    // checkbox for that one, otherwise the first input.
    const target =
      form.querySelector("#area") ?? form.querySelector("#box") ?? form.querySelector("input");
    plan.push([label, target]);
  });

  const rects = plan.map(([, node]) => {
    const r = node.getBoundingClientRect();
    return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) };
  });

  // Click to focus, then Enter — two steps per case. A click rather than `.focus()`
  // because a trusted press is what a real user does and the earlier probes established
  // that focus provenance can matter.
  const steps = [];
  const labels = [];
  rects.forEach((at, i) => {
    steps.push({ ...at, down: 1, up: 1 });
    labels.push(null);
    steps.push({ key: "Enter" });
    labels.push(i);
  });

  window.__probeMouse = steps;
  window.__probeStep = (n) => {
    const i = labels[n];
    if (i === null || i === undefined) return;
    const [label] = plan[i];
    const area = document.getElementById("area");
    // For the textarea case, whether Enter typed a newline is the actual question, and
    // "no submit" alone would not distinguish it from Enter being swallowed.
    const typed = plan[i][1] === area && area ? ` textarea=${JSON.stringify(area.value)}` : "";
    log(label.padEnd(28) + " -> " + (seen.join(", ") || "nothing") + typed);
    seen.length = 0;
  };
  window.__probeMouseDone = () => report();

  document.title = "ready";
</script>
