<!doctype html>
<meta charset="utf-8">
<title>focus-event-order</title>
<style>
  body { font: 12px ui-monospace, monospace; padding: 16px }
  #out { white-space: pre; line-height: 1.5 }
  #stage { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
  #stage > * { flex: none }
</style>
<h3>when focus moves, what fires, in what order, and what is focused during each?</h3>
<div id="stage"></div>
<script type="module">
  import { log, report } from "./_harness.js";

  /**
   * The question dziry needs answered.
   *
   * ROADMAP A3 names "focus and blur ordering" as a thing to measure before writing Rust,
   * and it is the one item on that list that was skipped — Tab order, `:focus-visible` and
   * activation were all probed and this was not. It is the gap between the focus model
   * being *built* and being *usable*: an app cannot validate a field on blur, cannot save
   * a draft when focus leaves, and cannot show a hint while a control has focus, because
   * dziry emits no element focus event at all. `EventKind::FOCUS` is the window's.
   *
   * Three things have to be known before an event kind can be designed, and each one
   * changes the shape:
   *
   * 1. **Order.** If the leaving element's event fires before the arriving one's, one
   *    queue in the right order is enough. If they interleave, a host replaying the queue
   *    can reconstruct nothing.
   * 2. **What `activeElement` is during each.** This decides whether the event has to
   *    *carry* the other node. If focus has already moved by the time the leaving element
   *    hears about it, then "who took my focus" is unanswerable without a field for it —
   *    and "where did focus come from" likewise.
   * 3. **Whether the pair fires at all in the cases dziry produces**: a click, a Tab, and
   *    focus leaving for nothing. A pair that does not fire on one of those is a hole an
   *    app would have to work around.
   *
   * `focus`/`blur` and `focusin`/`focusout` are both recorded. dziry has no bubbling, so
   * the distinction is not one it can reproduce — but which of the two a browser fires
   * *first* says which one is the primitive, and that is the one to copy.
   */

  const stage = document.getElementById("stage");
  stage.innerHTML = `
    <button id="a">A</button>
    <button id="b">B</button>
    <input id="field" type="text" size="8">
    <div id="dead">not focusable</div>
  `;

  const el = (id) => document.getElementById(id);
  const centre = (node) => {
    const r = node.getBoundingClientRect();
    return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) };
  };
  const name = (n) => (!n || n === document.body ? "BODY" : n.tagName.toLowerCase() + (n.id ? "#" + n.id : ""));

  /**
   * One ordered log across every element, with `activeElement` sampled *inside* each
   * handler.
   *
   * Sampling inside is the whole point: the answer to "has focus moved yet" is only
   * visible from within the event that is asking. Reading it after the fact would report
   * the settled state and make every row look the same.
   */
  const fired = [];
  const watch = (node) => {
    for (const n of ["blur", "focusout", "focus", "focusin"]) {
      node.addEventListener(n, (e) => {
        // `relatedTarget` is the browser's own answer to "the other element" — the one
        // dziry would have to add a field for if it wants the same. Recorded so the need
        // is measured rather than assumed.
        fired.push(`${node.id}:${n}(active=${name(document.activeElement)},rel=${name(e.relatedTarget)})`);
      });
    }
  };
  for (const id of ["a", "b", "field"]) watch(el(id));

  const drain = () => {
    const s = fired.join("\n      ") || "none";
    fired.length = 0;
    return s;
  };

  const row = (label) => log(label.padEnd(30) + " active=" + name(document.activeElement) + "\n      " + drain());

  const plan = [
    ["click A (from nothing)", { ...centre(el("a")), down: 1, up: 1 }],
    ["click B (A -> B)", { ...centre(el("b")), down: 1, up: 1 }],
    ["Tab (B -> field)", { key: "Tab" }],
    ["Shift+Tab (field -> B)", { key: "Tab", modifiers: 8 }],

    // A press on something that cannot take focus. dziry focuses whatever it hits, so
    // this is the case where the two models most plausibly diverge — and an app that
    // saves on blur needs to know whether it gets one here.
    ["click a non-focusable div", { ...centre(el("dead")), down: 1, up: 1 }],

    // Re-clicking the already-focused element. If it fires a blur/focus pair, an app
    // validating on blur would validate on every click, which is the kind of thing that
    // is only annoying once it ships.
    ["click B", { ...centre(el("b")), down: 1, up: 1 }],
    ["click B again", { ...centre(el("b")), down: 1, up: 1 }],
  ];

  window.__probeMouse = plan.map(([, p]) => p);
  const labels = plan.map(([l]) => l);

  row("initial");
  window.__probeStep = (i) => row(labels[i] ?? `step ${i}`);

  window.__probeMouseDone = () => {
    log("");
    log("Reading it: a row whose `blur` reports active=BODY means focus had already left by");
    log("the time the old element was told, so `relatedTarget` is the only way to know who");
    log("took it — and dziry would need a field for that.");
    report();
  };

  document.title = "ready";
</script>
