# The reactive rewrite, for `bun test`.
#
# `[test]` only, deliberately — **do not add a top-level `preload` here.** A
# `bun build --compile` executable reads `bunfig.toml` from its working directory
# and honours the top-level `preload` it finds, but resolves it against its own
# virtual filesystem rather than `node_modules`. Measured: `./dist/app.exe` run
# from the project root died with
#
#     error: preload not found "dziry/compiler/reactive-preload.ts"
#
# before a single line of the app ran. `[test]` is not read by the compiled binary,
# so the rewrite reaches the test runner without the shipped app tripping over it.
#
# Nothing else needs an entry. `dziry dev` passes `--preload` to the app it spawns,
# and `dziry build` applies the rewrite through the bundler's plugin list — so the
# two paths that matter are covered without this file.
[test]
preload = ["dziry/compiler/reactive-preload.ts"]
